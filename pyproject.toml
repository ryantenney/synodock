[project]
name = "synodock"
version = "0.1.0"
description = "docker exec and a Docker Engine API for Synology NAS containers, over DSM's web API: no SSH"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Tenney" }]
requires-python = ">=3.12"
dependencies = [
    "truststore>=0.10",
    "websockets>=13",
]
keywords = ["synology", "dsm", "container-manager", "docker", "nas"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/ryantenney/synodock"

[project.scripts]
synodock = "synodock.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"
